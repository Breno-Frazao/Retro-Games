<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Games Retro</h1>
        <p>🎮Venda de Jogos Clássicos🕹️!</p>
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo do site" class="logo-img">
        </div>
    </header>

    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso catálogo</h2>
                <p>Conheça os Jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>

        <section id="listarDiscos" class="listar-discos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>

    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>
        <form id="formDisco">
            <label for="album">Nome do jogo</label>
            <input type="text" id="album" required>
            <label for="artista">Desenvolvedor</label>
            <input type="text" id="artista" required>
            <label for="genero">Gênero</label>
            <input type="text" id="genero" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
